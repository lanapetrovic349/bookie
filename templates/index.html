{% extends 'template.html' %}

{% block title %} 
    Login 
{% endblock %} 
{% block content %} 
<div> 
    <form method="post"> 
        {% csrf_token %} 
        {{ form.as_p }} 
        <button type="submit">Login</button> 
    </form> 
    {% if form.non_field_errors %}
        <div> 
            {{ form.non_field_errors }} 
        </div> 
    {% endif %} 
</div>
{% endblock %}
